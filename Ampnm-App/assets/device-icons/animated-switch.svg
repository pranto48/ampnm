<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes sw-port-blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    @keyframes sw-data-flow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    .p1 { animation: sw-port-blink 0.9s ease-in-out infinite; }
    .p2 { animation: sw-port-blink 0.9s ease-in-out 0.15s infinite; }
    .p3 { animation: sw-port-blink 0.9s ease-in-out 0.3s infinite; }
    .p4 { animation: sw-port-blink 0.9s ease-in-out 0.45s infinite; }
    .p5 { animation: sw-port-blink 0.9s ease-in-out 0.6s infinite; }
    .p6 { animation: sw-port-blink 0.9s ease-in-out 0.75s infinite; }
    .data-line {
      stroke-dasharray: 5,4;
      animation: sw-data-flow 0.6s linear infinite;
    }
  </style>
  <!-- Switch chassis -->
  <rect x="8" y="36" width="84" height="28" rx="5" fill="#0b1e36" stroke="#00F2FE" stroke-width="2.5"/>
  <!-- Status LED strip -->
  <rect x="14" y="40" width="6" height="5" rx="1.5" fill="#00FF87" class="p1"/>
  <rect x="24" y="40" width="6" height="5" rx="1.5" fill="#00FF87" class="p2"/>
  <rect x="34" y="40" width="6" height="5" rx="1.5" fill="#00FF87" class="p3"/>
  <rect x="44" y="40" width="6" height="5" rx="1.5" fill="#00F2FE" class="p4"/>
  <rect x="54" y="40" width="6" height="5" rx="1.5" fill="#00FF87" class="p5"/>
  <rect x="64" y="40" width="6" height="5" rx="1.5" fill="#FFAA00" class="p6"/>
  <!-- Port sockets -->
  <rect x="14" y="49" width="6" height="8" rx="1" fill="#1e3a5f" stroke="#00F2FE" stroke-width="1"/>
  <rect x="24" y="49" width="6" height="8" rx="1" fill="#1e3a5f" stroke="#00F2FE" stroke-width="1"/>
  <rect x="34" y="49" width="6" height="8" rx="1" fill="#1e3a5f" stroke="#00F2FE" stroke-width="1"/>
  <rect x="44" y="49" width="6" height="8" rx="1" fill="#1e3a5f" stroke="#00F2FE" stroke-width="1"/>
  <rect x="54" y="49" width="6" height="8" rx="1" fill="#1e3a5f" stroke="#00F2FE" stroke-width="1"/>
  <rect x="64" y="49" width="6" height="8" rx="1" fill="#1e3a5f" stroke="#00F2FE" stroke-width="1"/>
  <!-- Data flow lines below switch -->
  <line x1="17" y1="57" x2="17" y2="70" stroke="#00F2FE" stroke-width="1.5" class="data-line"/>
  <line x1="27" y1="57" x2="27" y2="70" stroke="#00FF87" stroke-width="1.5" class="data-line"/>
  <line x1="37" y1="57" x2="37" y2="70" stroke="#00F2FE" stroke-width="1.5" class="data-line"/>
  <line x1="47" y1="57" x2="47" y2="70" stroke="#00F2FE" stroke-width="1.5" class="data-line"/>
  <line x1="57" y1="57" x2="57" y2="70" stroke="#FFAA00" stroke-width="1.5" class="data-line"/>
  <line x1="67" y1="57" x2="67" y2="70" stroke="#00F2FE" stroke-width="1.5" class="data-line"/>
</svg>
