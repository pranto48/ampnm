<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes blade-led {
      0%, 100% { fill: #00FF87; }
      50% { fill: #00F2FE; }
    }
    @keyframes blade-activity {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .led { animation: blade-led 1s ease-in-out infinite; }
    .act1 { animation: blade-activity 1.2s ease-in-out 0s infinite; }
    .act2 { animation: blade-activity 1.2s ease-in-out 0.3s infinite; }
    .act3 { animation: blade-activity 1.2s ease-in-out 0.6s infinite; }
    .act4 { animation: blade-activity 1.2s ease-in-out 0.9s infinite; }
  </style>
  <!-- Blade Chassis container -->
  <rect x="12" y="20" width="76" height="60" rx="5" fill="#0b1e36" stroke="#00F2FE" stroke-width="2.5"/>
  <!-- Dark slots panel -->
  <rect x="16" y="26" width="68" height="48" rx="2" fill="#041830"/>
  <!-- Blade slot 1 (vertical blade unit) -->
  <rect x="20" y="30" width="10" height="40" rx="1" fill="#0b1e36" stroke="#00F2FE" stroke-width="1.5"/>
  <circle cx="25" cy="36" r="1.5" class="led"/>
  <rect x="23" y="44" width="4" height="12" rx="0.5" fill="#00FF87" class="act1"/>
  <rect x="23" y="60" width="4" height="4" rx="0.5" fill="#00F2FE"/>
  
  <!-- Blade slot 2 -->
  <rect x="36" y="30" width="10" height="40" rx="1" fill="#0b1e36" stroke="#00F2FE" stroke-width="1.5"/>
  <circle cx="41" cy="36" r="1.5" class="led" style="animation-delay: 0.25s;"/>
  <rect x="39" y="44" width="4" height="12" rx="0.5" fill="#00FF87" class="act2"/>
  <rect x="39" y="60" width="4" height="4" rx="0.5" fill="#00F2FE"/>
  
  <!-- Blade slot 3 -->
  <rect x="52" y="30" width="10" height="40" rx="1" fill="#0b1e36" stroke="#00F2FE" stroke-width="1.5"/>
  <circle cx="57" cy="36" r="1.5" class="led" style="animation-delay: 0.5s;"/>
  <rect x="55" y="44" width="4" height="12" rx="0.5" fill="#00FF87" class="act3"/>
  <rect x="55" y="60" width="4" height="4" rx="0.5" fill="#00F2FE"/>
  
  <!-- Blade slot 4 -->
  <rect x="68" y="30" width="10" height="40" rx="1" fill="#0b1e36" stroke="#00F2FE" stroke-width="1.5"/>
  <circle cx="73" cy="36" r="1.5" class="led" style="animation-delay: 0.75s;"/>
  <rect x="71" y="44" width="4" height="12" rx="0.5" fill="#00FF87" class="act4"/>
  <rect x="71" y="60" width="4" height="4" rx="0.5" fill="#00F2FE"/>
</svg>
