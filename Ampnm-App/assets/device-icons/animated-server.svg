<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes flash-green {
      0%, 100% { fill: #00FF87; filter: drop-shadow(0 0 1px #00FF87); }
      50% { fill: #0b1e36; filter: none; }
    }
    @keyframes flash-blue {
      0%, 100% { fill: #00F2FE; filter: drop-shadow(0 0 1px #00F2FE); }
      50% { fill: #0b1e36; filter: none; }
    }
    .led-g1 { animation: flash-green 1s step-end infinite; }
    .led-g2 { animation: flash-green 1s step-end infinite; animation-delay: 0.3s; }
    .led-g3 { animation: flash-green 1s step-end infinite; animation-delay: 0.6s; }
    .led-b1 { animation: flash-blue 1.2s step-end infinite; }
    .led-b2 { animation: flash-blue 1.2s step-end infinite; animation-delay: 0.4s; }
    .led-b3 { animation: flash-blue 1.2s step-end infinite; animation-delay: 0.8s; }
  </style>
  <!-- Outer Chassis -->
  <rect x="15" y="15" width="70" height="70" rx="5" fill="#0b1e36" stroke="#00F2FE" stroke-width="3" />
  <!-- Server Blades (3 units) -->
  <g>
    <!-- Unit 1 -->
    <rect x="22" y="25" width="56" height="12" rx="2" fill="#132a4a" stroke="#00F2FE" stroke-width="1.5" />
    <circle cx="30" cy="31" r="2.5" class="led-g1" />
    <circle cx="37" cy="31" r="2.5" class="led-g2" />
    <circle cx="44" cy="31" r="2.5" class="led-g3" />
    <rect x="54" y="29" width="16" height="4" rx="1" fill="#00F2FE" opacity="0.6" />
    <!-- Unit 2 -->
    <rect x="22" y="44" width="56" height="12" rx="2" fill="#132a4a" stroke="#00F2FE" stroke-width="1.5" />
    <circle cx="30" cy="50" r="2.5" class="led-b1" />
    <circle cx="37" cy="50" r="2.5" class="led-b2" />
    <circle cx="44" cy="50" r="2.5" class="led-b3" />
    <rect x="54" y="48" width="16" height="4" rx="1" fill="#00F2FE" opacity="0.6" />
    <!-- Unit 3 -->
    <rect x="22" y="63" width="56" height="12" rx="2" fill="#132a4a" stroke="#00F2FE" stroke-width="1.5" />
    <circle cx="30" cy="69" r="2.5" class="led-g3" />
    <circle cx="37" cy="69" r="2.5" class="led-g1" />
    <circle cx="44" cy="69" r="2.5" class="led-g2" />
    <rect x="54" y="67" width="16" height="4" rx="1" fill="#00F2FE" opacity="0.6" />
  </g>
</svg>
