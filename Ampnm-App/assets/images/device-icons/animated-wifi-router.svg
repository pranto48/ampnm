<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes wifi-wave {
      0% { opacity: 0; transform: scale(0.6); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.1); }
    }
    @keyframes wifi-blink {
      0%, 100% { fill: #00FF87; }
      50% { fill: #00F2FE; }
    }
    .w-wave1 { animation: wifi-wave 2s ease-out 0s infinite; transform-origin: 50px 30px; }
    .w-wave2 { animation: wifi-wave 2s ease-out 1s infinite; transform-origin: 50px 30px; }
    .led { animation: wifi-blink 1s ease-in-out infinite; }
  </style>
  <!-- Antennas (3 antennas) -->
  <line x1="25" y1="46" x2="15" y2="16" stroke="#00F2FE" stroke-width="2.5"/>
  <circle cx="15" cy="15" r="2.5" fill="#00F2FE"/>
  <line x1="50" y1="42" x2="50" y2="12" stroke="#00F2FE" stroke-width="2.5"/>
  <circle cx="50" cy="11" r="2.5" fill="#00F2FE"/>
  <line x1="75" y1="46" x2="85" y2="16" stroke="#00F2FE" stroke-width="2.5"/>
  <circle cx="85" cy="15" r="2.5" fill="#00F2FE"/>
  
  <!-- Outer signal broadcast waves -->
  <path d="M30,22 Q50,8 70,22" fill="none" stroke="#00FF87" stroke-width="1.8" class="w-wave1"/>
  <path d="M22,14 Q50,0 78,14" fill="none" stroke="#00F2FE" stroke-width="1.2" class="w-wave2"/>
  
  <!-- Router body -->
  <rect x="18" y="46" width="64" height="28" rx="5" fill="#0b1e36" stroke="#00F2FE" stroke-width="2.5"/>
  <!-- Dark panel -->
  <rect x="22" y="50" width="56" height="12" rx="2" fill="#041830"/>
  
  <!-- Front active LEDs -->
  <circle cx="28" cy="56" r="2.5" class="led"/>
  <circle cx="38" cy="56" r="2.5" class="led" style="animation-delay:0.3s;"/>
  <circle cx="48" cy="56" r="2.5" class="led" style="animation-delay:0.6s;"/>
  <circle cx="58" cy="56" r="2.5" fill="#00FF87"/>
  <circle cx="68" cy="56" r="2.5" fill="#FFAA00"/>
</svg>
