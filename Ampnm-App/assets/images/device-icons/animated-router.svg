<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    @keyframes wave {
      0% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.3); }
    }
    .router-pulse {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: 50px 70px;
    }
    .signal-wave {
      animation: wave 2.5s linear infinite;
      transform-origin: 50px 30px;
      fill: none;
      stroke: #00F2FE;
      stroke-width: 2.5;
    }
    .wave-2 { animation-delay: 0.8s; }
    .wave-3 { animation-delay: 1.6s; }
  </style>
  <!-- Base Chassis -->
  <g class="router-pulse">
    <rect x="15" y="60" width="70" height="20" rx="4" fill="#0b1e36" stroke="#00F2FE" stroke-width="3" />
    <circle cx="25" cy="70" r="2.5" fill="#00F2FE" />
    <circle cx="35" cy="70" r="2" fill="#00FF87" />
    <circle cx="45" cy="70" r="2" fill="#00FF87" />
    <circle cx="55" cy="70" r="2" fill="#00FF87" />
    <!-- Antennas -->
    <line x1="22" y1="60" x2="22" y2="35" stroke="#00F2FE" stroke-width="3" />
    <line x1="78" y1="60" x2="78" y2="35" stroke="#00F2FE" stroke-width="3" />
    <circle cx="22" cy="33" r="3" fill="#00F2FE" />
    <circle cx="78" cy="33" r="3" fill="#00F2FE" />
  </g>
  <!-- Signal Waves from the center -->
  <circle cx="50" cy="30" r="8" class="signal-wave" />
  <circle cx="50" cy="30" r="16" class="signal-wave wave-2" />
  <circle cx="50" cy="30" r="24" class="signal-wave wave-3" />
</svg>
