version: "3.9"

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: ampnm-app:ha
  restart: unless-stopped
  environment:
    APP_ENV: production
    APACHE_PORT: 2266

    # External HA database (managed or primary/replica topology).
    DB_HOST: ${DB_HOST:?set DB_HOST to your HA DB endpoint}
    DB_PORT: ${DB_PORT:-3306}
    DB_NAME: ${DB_NAME:-network_monitor}
    DB_USER: ${DB_USER:?set DB_USER}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}

    # Redis is required for queue + cache/session/locks.
    REDIS_HOST: queue
    REDIS_PORT: 6379
    REDIS_TIMEOUT: 1.5
    REDIS_DB: 0

    # Session and locking strategy for stateless API replicas.
    SESSION_DRIVER: redis
    CACHE_DRIVER: redis
    LOCK_DRIVER: redis

    METRICS_INGEST_STREAM: ampnm:metrics:ingest
    METRICS_INGEST_GROUP: metrics_workers

  # Keep API containers stateless: no bind mounts, ephemeral tmp only.
  tmpfs:
    - /tmp
    - /var/tmp

services:
  web:
    <<: *app-base
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["apache2-foreground"]
    ports:
      - "2266:2266"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2266/health/live.php >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      queue:
        condition: service_healthy

  queue:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "10000"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  workers:
    <<: *app-base
    command: ["php", "/var/www/html/api/workers/metrics_ingest_worker.php"]
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "php", "/var/www/html/api/workers/healthcheck.php", "worker"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      queue:
        condition: service_healthy

  scheduler:
    <<: *app-base
    command: ["php", "/var/www/html/api/workers/scheduler.php"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "php", "/var/www/html/api/workers/healthcheck.php", "scheduler"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      queue:
        condition: service_healthy

volumes:
  redis_data:
