<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes db-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes db-pulse {
      0%,100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes db-query {
      0% { stroke-dashoffset: 30; opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .db-ring { animation: db-spin 8s linear infinite; transform-origin: 50px 48px; }
    .db-glow { animation: db-pulse 2s ease-in-out infinite; }
    .q1 { animation: db-query 2s linear infinite; }
    .q2 { animation: db-query 2s linear 0.7s infinite; }
  </style>
  <!-- Spinning outer orbit ring -->
  <ellipse cx="50" cy="48" rx="42" ry="10" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="6,4" class="db-ring"/>
  <!-- Database cylinders -->
  <ellipse cx="50" cy="30" rx="24" ry="7" fill="#0b1e36" stroke="#00F2FE" stroke-width="2.5"/>
  <rect x="26" y="30" width="48" height="12" fill="#0b1e36"/>
  <ellipse cx="50" cy="42" rx="24" ry="7" fill="#0b1e36" stroke="#00F2FE" stroke-width="2.5" class="db-glow"/>
  <rect x="26" y="42" width="48" height="12" fill="#0b1e36"/>
  <ellipse cx="50" cy="54" rx="24" ry="7" fill="#0b1e36" stroke="#00F2FE" stroke-width="2.5"/>
  <!-- Side lines to emphasize cylinder shape -->
  <line x1="26" y1="30" x2="26" y2="54" stroke="#00F2FE" stroke-width="2.5"/>
  <line x1="74" y1="30" x2="74" y2="54" stroke="#00F2FE" stroke-width="2.5"/>
  <!-- Center glow dots in top ellipse -->
  <circle cx="42" cy="30" r="2" fill="#00FF87" class="db-glow"/>
  <circle cx="50" cy="30" r="2" fill="#00F2FE" class="db-glow"/>
  <circle cx="58" cy="30" r="2" fill="#00FF87" class="db-glow"/>
  <!-- Query flash lines -->
  <line x1="26" y1="36" x2="18" y2="70" stroke="#00FF87" stroke-width="1.5" stroke-dasharray="4,4" class="q1"/>
  <line x1="74" y1="36" x2="82" y2="70" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4,4" class="q2"/>
</svg>
