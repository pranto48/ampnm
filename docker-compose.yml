services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # This entrypoint ensures the script is executable and then runs it.
    # The script configures and starts the Apache server on the correct port.
    entrypoint: ["/bin/sh", "-c", "chmod +x /var/www/html/docker-entrypoint.sh && /var/www/html/docker-entrypoint.sh"]
    volumes:
      - ./:/var/www/html/
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    environment:
      # We use 127.0.0.1 because network_mode: host connects the app container
      # directly to the host's network, so it sees the database on localhost.
      - DB_HOST=127.0.0.1
      - DB_NAME=${MYSQL_DATABASE:-network_monitor}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
      - APP_LICENSE_KEY=${APP_LICENSE_KEY:-}
      - ALPHA_SMS_USERNAME=${ALPHA_SMS_USERNAME:-}
      - ALPHA_SMS_API_KEY=${ALPHA_SMS_API_KEY:-}
      - ALPHA_SMS_SENDER_ID=${ALPHA_SMS_SENDER_ID:-}
      - SMS_ALERTS_ENABLED=${SMS_ALERTS_ENABLED:-1}
      - SMS_COOLDOWN_MINUTES=${SMS_COOLDOWN_MINUTES:-30}
      - APACHE_PORT=${APACHE_PORT:-2266}
      # Cloud Monitoring Bridge - connect Docker ICMP pings to Lovable Cloud
      - CLOUD_SYNC_URL=${CLOUD_SYNC_URL:-}
      - CLOUD_ANON_KEY=${CLOUD_ANON_KEY:-}
      - CLOUD_POLL_INTERVAL=${CLOUD_POLL_INTERVAL:-15}
      # Non-disruptive update awareness scheduler (fetch + behind count only).
      - AMPNM_ENABLE_UPDATE_CHECK_SCHEDULER=1
      - AMPNM_UPDATE_CHECK_INTERVAL_SECONDS=3600
    restart: unless-stopped
    # network_mode: host is required for the ping command to work correctly.
    # This automatically exposes:
    #   - Apache Web Server: port 2266 (or APACHE_PORT)
    #   - Passive Polling Agent: port 10050
    #   - Active Telemetry Trapper: port 10051
    network_mode: "host"

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-network_monitor}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # Expose the database port to the host for external tools if needed
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
